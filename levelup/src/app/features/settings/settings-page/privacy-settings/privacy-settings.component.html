<div class="privacy-settings">
  <h2 class="settings-section__title">Privacy</h2>
  <p class="privacy-settings__desc">
    Control who can see parts of your profile.
  </p>

  <form [formGroup]="form" (ngSubmit)="save()" class="settings-form">
    <div class="settings-form__group">
      <label class="settings-form__label">Library visibility</label>
      <select class="settings-form__input" formControlName="libraryVisibility">
        @for (opt of visibilityOptions; track opt.value) {
          <option [value]="opt.value">{{ opt.label }}</option>
        }
      </select>
    </div>

    <div class="settings-form__group">
      <label class="settings-form__label">Wishlist visibility</label>
      <select class="settings-form__input" formControlName="wishlistVisibility">
        @for (opt of visibilityOptions; track opt.value) {
          <option [value]="opt.value">{{ opt.label }}</option>
        }
      </select>
    </div>

    <div class="settings-form__group">
      <label class="settings-form__label">Reviews visibility</label>
      <select class="settings-form__input" formControlName="reviewsVisibility">
        @for (opt of visibilityOptions; track opt.value) {
          <option [value]="opt.value">{{ opt.label }}</option>
        }
      </select>
    </div>

    @if (error()) {
      <p class="settings-form__error">{{ error() }}</p>
    }
    @if (success()) {
      <p class="settings-form__success">Privacy settings saved.</p>
    }

    <div class="settings-form__actions">
      <button class="btn btn--primary" type="submit" [disabled]="saving()">
        {{ saving() ? "Saving..." : "Save changes" }}
      </button>
    </div>
  </form>
</div>
