<div class="recent-activity">
  <h2 class="recent-activity__title">Recent Activity</h2>

  @if (loading() && events().length === 0) {
    <p class="recent-activity__loading">Loading...</p>
  } @else if (events().length === 0) {
    <p class="recent-activity__empty">No activity yet.</p>
  } @else {
    <div class="recent-activity__list">
      @for (event of events(); track event.id) {
        <app-feed-item [event]="event" />
      }
    </div>

    @if (hasMore()) {
      <button
        class="recent-activity__more"
        [disabled]="loading()"
        (click)="load()"
      >
        {{ loading() ? "Loading..." : "Load more" }}
      </button>
    }
  }
</div>
