<div class="rating" [class.rating--readonly]="readonly">
  @for (n of ratings; track n) {
    <button
      type="button"
      class="rating__heart"
      [class.rating__heart--active]="activeRating !== null && n <= activeRating"
      [disabled]="readonly"
      (click)="setRating(n)"
      (mouseenter)="setHovered(n)"
      (mouseleave)="setHovered(null)"
      [attr.aria-label]="n + ' out of 10'"
    >
      <svg
        class="star-icon"
        viewBox="0 0 10 10"
        xmlns="http://www.w3.org/2000/svg"
      >
        <polygon
          points="5,0.5 6.1,3.5 9.3,3.6 6.7,5.6 7.6,8.6 5,6.8 2.4,8.6 3.3,5.6 0.7,3.6 3.9,3.5"
        />
      </svg>
    </button>
  }
  @if (rating !== null) {
    <span class="rating__label">{{ rating }}/10</span>
  } @else {
    <span class="rating__label rating__label--empty">Rate</span>
  }
</div>
