<div class="challenge-result">
  <div class="challenge-result__score-ring">
    <span class="challenge-result__score">{{ result.score }}</span>
    <span class="challenge-result__score-denom">/100</span>
  </div>

  <h2 class="challenge-result__label">{{ scoreLabel }}</h2>

  <button class="challenge-result__share-btn" (click)="copyShareText()">
    {{ copied ? 'Copied!' : 'Copy Result' }}
  </button>

  <p class="challenge-result__share-text">{{ result.shareText }}</p>

  @if (friendScores.length > 0) {
    <app-friend-scores [scores]="friendScores" />
  }

  <a class="challenge-result__profile-link" routerLink="/feed">Back to Feed</a>
</div>
