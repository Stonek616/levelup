<div class="status-picker" [class.status-picker--open]="isOpen()">
  <button class="status-picker__trigger" (click)="toggle()" type="button">
    <span>{{ currentLabel }}</span>
    <svg
      class="status-picker__chevron"
      width="12"
      height="12"
      viewBox="0 0 12 12"
      fill="none"
      aria-hidden="true"
    >
      <path
        d="M2 4l4 4 4-4"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
  </button>

  @if (isOpen()) {
    <ul class="status-picker__dropdown" role="listbox">
      <li
        class="status-picker__option"
        [class.status-picker__option--active]="status === null"
        [attr.aria-selected]="status === null"
        (click)="selectNull()"
        (keyup.enter)="selectNull()"
        (keyup.space)="selectNull()"
        role="option"
        tabindex="0"
      >
        Add to library…
      </li>
      @for (option of options; track option) {
        <li
          class="status-picker__option"
          [class.status-picker__option--active]="option === status"
          [attr.aria-selected]="option === status"
          (click)="select(option)"
          (keyup.enter)="select(option)"
          (keyup.space)="select(option)"
          role="option"
          tabindex="0"
        >
          {{ labels[option] }}
        </li>
      }
    </ul>
  }
</div>
