@if (entries.length > 0) {
  <div class="library-grid">
    @for (entry of entries; track entry.id) {
      <div class="library-grid__case">
        <app-game-card [card]="toCard(entry)" />
      </div>
    }
  </div>
} @else {
  <div class="library-grid__empty">
    <p class="library-grid__empty-msg">Your library is empty.</p>
    <p class="library-grid__empty-hint">Search for a game to add it to your collection.</p>
  </div>
}
