version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: levelup_postgres
    environment:
      POSTGRES_DB: levelup_dev
      POSTGRES_USER: levelup
      POSTGRES_PASSWORD: levelup_dev_password
    ports:
      - "5432:5432"
    volumes:
      - levelup_postgres_data:/var/lib/postgresql/data

  adminer:
    image: adminer
    container_name: levelup_adminer
    command: php -d upload_max_filesize=64M -d post_max_size=64M -S [::]:8080 -t /var/www/html
    ports:
      - "8081:8080"
    depends_on:
      - postgres

volumes:
  levelup_postgres_data: