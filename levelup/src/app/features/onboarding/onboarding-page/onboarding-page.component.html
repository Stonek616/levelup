<div class="onboarding">
  <div class="onboarding__card">
    <div class="onboarding__progress">
      <div
        class="onboarding__progress-bar"
        [style.width.%]="step() === 1 ? 50 : 100"
      ></div>
    </div>

    @if (step() === 1) {
      <app-onboarding-prefs-step (completed)="onPrefsComplete($event)" />
    } @else {
      <app-onboarding-search-step
        [submitting]="submitting()"
        [error]="error()"
        (completed)="onSearchComplete($event)"
        (back)="onBack()"
      />
    }
  </div>
</div>
