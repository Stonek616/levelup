<nav class="navbar">
  <div class="navbar__inner">
    <a class="navbar__brand" routerLink="/">LevelUp</a>

    @if (currentUser()) {
      <ul class="navbar__links">
        <li>
          <a
            routerLink="/feed"
            routerLinkActive="navbar__link--active"
            class="navbar__link"
            >Feed</a
          >
        </li>
        <li>
          <a
            routerLink="/library"
            routerLinkActive="navbar__link--active"
            class="navbar__link"
            >Library</a
          >
        </li>
        <li>
          <a
            routerLink="/friends"
            routerLinkActive="navbar__link--active"
            class="navbar__link"
            >Friends</a
          >
        </li>
        <li>
          <a
            routerLink="/what-to-play"
            routerLinkActive="navbar__link--active"
            class="navbar__link"
            >What to Play</a
          >
        </li>
      </ul>
    }

    <div class="navbar__search">
      <app-game-search-input (gameSelected)="onGameSelected($event)" />
    </div>

    <div class="navbar__end">
      <button
        class="navbar__theme-btn"
        (click)="themeService.toggle()"
        [title]="isDark() ? 'Switch to light mode' : 'Switch to dark mode'"
      >
        @if (isDark()) {
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="5" />
            <line x1="12" y1="1" x2="12" y2="3" />
            <line x1="12" y1="21" x2="12" y2="23" />
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
            <line x1="1" y1="12" x2="3" y2="12" />
            <line x1="21" y1="12" x2="23" y2="12" />
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
          </svg>
        } @else {
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
          </svg>
        }
      </button>

      @if (currentUser()) {
        <div class="navbar__menu">
          <button class="navbar__profile" (click)="menuOpen.set(!menuOpen())">
            <div class="navbar__avatar">
              @if (currentUser()!.avatarUrl) {
                <img
                  [src]="currentUser()!.avatarUrl"
                  [alt]="currentUser()!.username"
                  class="navbar__avatar-img"
                />
              } @else {
                {{ currentUser()!.username.charAt(0).toUpperCase() }}
              }
            </div>
            <span class="navbar__username">{{ currentUser()!.username }}</span>
            <svg
              class="navbar__chevron"
              [class.navbar__chevron--open]="menuOpen()"
              width="12"
              height="12"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <polyline points="6 9 12 15 18 9" />
            </svg>
          </button>

          @if (menuOpen()) {
            <div class="navbar__dropdown">
              <a
                class="navbar__dropdown-item"
                [routerLink]="['/profile', currentUser()!.username]"
                (click)="menuOpen.set(false)"
              >
                Profile
              </a>
              <a
                class="navbar__dropdown-item"
                routerLink="/settings"
                (click)="menuOpen.set(false)"
              >
                Settings
              </a>
              @if (isAdmin()) {
                <a
                  class="navbar__dropdown-item"
                  routerLink="/admin/reports"
                  (click)="menuOpen.set(false)"
                >
                  Admin
                </a>
              }
              <div class="navbar__dropdown-divider"></div>
              <button
                class="navbar__dropdown-item navbar__dropdown-item--danger"
                (click)="logout()"
              >
                Sign out
              </button>
            </div>
          }
        </div>
      } @else {
        <a routerLink="/login" class="btn btn--ghost btn--sm">Sign in</a>
        <a routerLink="/register" class="btn btn--primary btn--sm"
          >Get started</a
        >
      }
    </div>
  </div>
</nav>
