<div class="challenge-active">
  <div class="challenge-active__progress">
    <span class="challenge-active__round-label">Round {{ currentRoundIndex() + 1 }} of {{ totalRounds }}</span>
    <div class="challenge-active__progress-bar">
      @for (r of payload.rounds; track r.roundNumber; let i = $index) {
        <div class="challenge-active__progress-step"
             [class.challenge-active__progress-step--done]="i < currentRoundIndex()"
             [class.challenge-active__progress-step--active]="i === currentRoundIndex()">
        </div>
      }
    </div>
  </div>

  <h2 class="challenge-active__instruction">Which game doesn't belong?</h2>

  <div class="challenge-active__grid">
    @for (game of currentRound.games; track game.gameId; let i = $index) {
      <button
        class="challenge-active__game-card"
        [class.challenge-active__game-card--selected]="selectedIndex() === i"
        [disabled]="revealed()"
        (click)="selectGame(i)">
        <img class="challenge-active__cover"
             [src]="coverUrl(game)"
             [alt]="game.title"
             loading="lazy" />
        <span class="challenge-active__game-title">{{ game.title }}</span>
      </button>
    }
  </div>

  <div class="challenge-active__actions">
    @if (!revealed()) {
      <button
        class="challenge-active__btn challenge-active__btn--primary"
        [disabled]="selectedIndex() === null"
        (click)="confirmSelection()">
        Lock In Answer
      </button>
    } @else {
      <button
        class="challenge-active__btn challenge-active__btn--next"
        (click)="nextRound()">
        @if (currentRoundIndex() + 1 < totalRounds) {
          Next Round
        } @else {
          See Results
        }
      </button>
    }
  </div>
</div>
