<div class="library-page">
  <header class="library-page__header">
    <div>
      <p class="library-page__eyebrow">LevelUp · Collection</p>
      <h1 class="library-page__title">The Library</h1>
    </div>
    <div class="library-page__count">
      <span class="library-page__count-number">{{ totalElements() }}</span>
      <span class="library-page__count-label">Games</span>
    </div>
  </header>

  <app-library-toolbar
    [availablePlatforms]="availablePlatforms()"
    (filtersChanged)="onFiltersChanged($event)"
  />

  @if (loading()) {
    <p class="library-page__loading">Loading...</p>
  } @else {
    <app-library-grid [entries]="entries()" />
  }
</div>
