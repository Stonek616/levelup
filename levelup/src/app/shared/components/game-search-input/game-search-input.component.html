<div class="search-container">
  <input
    type="text"
    placeholder="Search games..."
    (input)="onInput($event)"
  />

  @if (loading()) {
    <p>Searching...</p>
  }

  @if (results().length > 0) {
    <ul class="results-list">
      @for (game of results(); track game.id) {
        <li>
          <button type="button" (click)="selectGame(game)">
            {{ game.title }} @if (game.releaseYear) { ({{ game.releaseYear }}) }
          </button>
        </li>
      }
    </ul>
  }
</div>
