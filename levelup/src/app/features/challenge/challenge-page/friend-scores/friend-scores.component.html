<div class="friend-scores">
  <h3 class="friend-scores__title">Friends' Scores</h3>
  <ul class="friend-scores__list">
    @for (score of scores; track score.username) {
      <li class="friend-scores__item">
        <span class="friend-scores__username">{{ score.username }}</span>
        <span class="friend-scores__score">{{ score.score }}/100</span>
        <span class="friend-scores__time">{{ score.completedAt | date:'shortTime' }}</span>
      </li>
    }
  </ul>
</div>
