<div class="game-card">
  @if (coverUrl) {
    <img [src]="coverUrl" [alt]="game.title" class="game-cover" />
  } @else {
    <div class="game-cover-placeholder">No Image</div>
  }

  <div class="game-info">
    <h3 class="game-title">{{ game.title }}</h3>

    @if (game.releaseYear) {
      <p class="game-year">{{ game.releaseYear }}</p>
    }

    @if (game.platforms && game.platforms.length > 0) {
      <p class="game-platforms">{{ game.platforms.join(', ') }}</p>
    }
  </div>
</div>
